<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Agendamentos</title>

<link rel="stylesheet" href="estilo.css">

<style>

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

h1{
    color:#d4af37;
    text-align:center;
    font-size:60px;
}

#filtroData{
    display:block;
    margin:20px auto;
    padding:12px;
    border:1px solid #d4af37;
    border-radius:10px;
    background:#222;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #d4af37;
    padding:10px;
    text-align:center;
}

th{
    background:#d4af37;
    color:#000;
}

td{
    background:#222;
}

</style>

</head>
<body>

<div class="container">

    <h1>AGENDAMENTOS</h1>

    <input type="date" id="filtroData">

    <table>
        <thead>
            <tr>
                <th>Hora</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Serviço</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="listaAgendamentos"></tbody>
    </table>

</div>

<script type="module" src="painel.js"></script>

</body>
</html>
