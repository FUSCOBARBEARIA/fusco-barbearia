<div class="container">

    <h1>FUSCO BARBEARIA</h1>

    <p>Cortes modernos, barba e acabamento de qualidade.</p>

    <form id="agendamentoForm">

        <input type="text" id="nome" placeholder="Seu nome" required>

        <input type="tel" id="telefone" placeholder="Seu telefone" required>

        <select id="servico" required>
            <option value="">Escolha um serviço</option>
            <option>Corte Masculino - R$50,00</option>
            <option>Barba - R$40,00</option>
            <option>Pé de Cabelo - R$15,00</option>
            <option>Sobrancelha - R$15,00</option>
            <option>Cabelo + Barba - R$80,00</option>
        </select>

        <input type="date" id="data" required>

<select id="hora" required>
    <option value="">Escolha um horário</option>
    <option>09:00</option>
    <option>10:00</option>
    <option>11:00</option>
    <option>12:00</option>
    <option>13:00</option>
    <option>14:00</option>
    <option>15:00</option>
    <option>16:00</option>
    <option>17:00</option>
    <option>18:00</option>
    <option>19:00</option>
    <option>20:00</option>
    <option>21:00</option>
</select>

        <button type="submit">
            Agendar pelo WhatsApp
        </button>

    </form>

<div class="contato">
    
    <p>📱 WhatsApp: (14) 99690-9094</p>
